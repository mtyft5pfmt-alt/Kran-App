# Für UGREEN NAS: Docker → Projekt → Erstellen → diesen Inhalt einfügen.
services:
  kran-app:
    image: ghcr.io/mtyft5pfmt-alt/kran-app:latest
    container_name: kran-app
    restart: unless-stopped
    ports:
      - "8090:8080"          # App erreichbar unter http://<NAS-IP>:8090
    environment:
      TZ: Europe/Berlin
      ADMIN_USER: admin              # erster Admin, wird nur beim allerersten Start angelegt
      ADMIN_PASSWORD: BitteAendern123
    volumes:
      - ./data:/data         # hier liegt die Datenbank (mit NAS-Backup sichern)
