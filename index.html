<body>
<header><h1 id="h-title">Kran-Wartung</h1><button id="sync" title="Abgleich"><i></i></button><span id="h-action"></span></header>

<script>
'use strict';

/* ---------- Konstanten ---------- */
const ARTEN = {
  wartung:   {label:'Wartung',        badge:'b-green'},
  pruefung:  {label:'UVV-Prüfung',    badge:'b-amber'},
  inspektion:{label:'Inspektion',     badge:'b-grey'},
  reparatur: {label:'Reparatur',      badge:'b-red'},
  stoerung:  {label:'Störung',        badge:'b-red'},
};
const KRANTYPEN = ['Brückenkran','Portalkran','Halbportalkran','Schwenkkran','Hängekran',
  'Turmdrehkran','Mobilkran','Ladekran','Elektrokettenzug','Seilzug','Sonstiges'];
const ANSTEUERUNGEN = ['Hängetaster','Funk','Funk + Hängetaster','Kabine','Sonstige'];
// [Feldname, Beschriftung, Eingabetyp, Zusatzattribute]
const FUNK_FELDER = [
  ['funkHersteller','Funk-Hersteller','text','list="dl-funkhersteller"'],
  ['funkSystem','System / Baureihe'],
  ['funkSenderTyp','Sender Typ'],
  ['funkSenderSn','Sender Seriennr.'],
  ['funkSenderAdr','Sender Adresse / ID-Code'],
  ['funkEmpfTyp','Empfänger Typ'],
  ['funkEmpfSn','Empfänger Seriennr.'],
  ['funkEmpfAdr','Empfänger Adresse / ID-Code'],
  ['funkFrequenz','Frequenz / Band','text','list="dl-funkfrequenz"'],
  ['funkKanal','Kanal'],
  ['funkErsatzSender','Ersatzsender Seriennr.'],
  ['funkAkku','Akku / Ladegerät'],
];
const HT_FELDER = [
  ['htTyp','Hängetaster Hersteller / Typ'],
  ['htSpannung','Steuerspannung (V)','text','inputmode="decimal"'],
  ['htKabel','Kabellänge (m)','text','inputmode="decimal"'],
];
const hatFunk = a => /Funk/.test(a || '');
const hatHT = a => /Hängetaster/.test(a || '');
const DEFAULT_CHECKS = [
  'Tragmittel / Seil / Kette',
  'Lasthaken & Hakensicherung',
  'Bremsen (Hub / Fahrt)',
  'Endschalter (Hub / Fahrt)',
  'NOT-HALT',
  'Steuerung / Hängetaster / Funk',
  'Laufbahn, Räder, Puffer',
  'Getriebe & Schmierung',
  'Elektrik / Kabel / Schleifleitung',
  'Traglastschild & Beschilderung',
  'Tragkonstruktion / Schrauben',
];
const SOON_DAYS = 30;

/* ---------- Datenbank (IndexedDB) ---------- */
const DB = (() => {
  let dbp;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('kran-wartung', 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('cranes')) db.createObjectStore('cranes', {keyPath:'id'});
        if (!db.objectStoreNames.contains('entries')) db.createObjectStore('entries', {keyPath:'id'}).createIndex('craneId', 'craneId');
        // Änderungen, die noch nicht an den Server übertragen wurden
        if (!db.objectStoreNames.contains('pending')) db.createObjectStore('pending', {keyPath:'key'});
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn){
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    all:  store => tx(store, 'readonly', s => s.getAll()),
    get:  (store, id) => tx(store, 'readonly', s => s.get(id)),
    put:  (store, obj) => tx(store, 'readwrite', s => s.put(obj)),
    del:  (store, id) => tx(store, 'readwrite', s => s.delete(id)),
    clear: store => tx(store, 'readwrite', s => s.clear()),
    /* Vom Benutzer geänderte Daten: Zeitstempel setzen und für den Abgleich vormerken */
    async save(store, obj, {keepUpdated = false} = {}){
      if (!keepUpdated || !obj.updated) obj.updated = Date.now();
      await this.put(store, obj);
      if (Sync.mode) { await this.put('pending', {key: store + ':' + obj.id, store, id: obj.id, updated: obj.updated, deleted: false}); Sync.soon(); }
    },
    async remove(store, id){
      await this.del(store, id);
      if (Sync.mode) { await this.put('pending', {key: store + ':' + id, store, id, updated: Date.now(), deleted: true}); Sync.soon(); }
    },
  };
})();

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const parseDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtDate = s => s ? parseDate(s).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}) : '–';
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return d; };
const daysUntil = d => { const t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t) / 86400000); };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function setHeader(title, actionHtml = ''){ $('#h-title').textContent = title; $('#h-action').innerHTML = actionHtml; document.title = title; }

/* Fälligkeit für eine Art (wartung | pruefung) */
function dueInfo(crane, entries, art){
  const interval = Number(art === 'pruefung' ? crane.intervallPruefung : crane.intervallWartung) || 0;
  if (!interval) return null;
  const last = entries.filter(e => e.craneId === crane.id && e.art === art).sort((a,b) => b.datum.localeCompare(a.datum))[0];
  if (!last) {
    if (crane.inbetrieb) {
      const due = addDays(crane.inbetrieb, interval);
      return {due, days: daysUntil(due), last: null};
    }
    return {due:null, days:null, last:null};
  }
  const due = addDays(last.datum, interval);
  return {due, days: daysUntil(due), last};
}
function statusOf(info){
  if (!info) return {cls:'b-grey', text:'kein Intervall', rank:3};
  if (info.days === null) return {cls:'b-grey', text:'noch nie', rank:1};
  if (info.days < 0) return {cls:'b-red', text:`${-info.days} T überfällig`, rank:0};
  if (info.days === 0) return {cls:'b-red', text:'heute fällig', rank:0};
  if (info.days <= SOON_DAYS) return {cls:'b-amber', text:`in ${info.days} T`, rank:2};
  return {cls:'b-green', text:`in ${info.days} T`, rank:4};
}
function craneStatus(crane, entries){
  const w = statusOf(dueInfo(crane, entries, 'wartung'));
  const p = statusOf(dueInfo(crane, entries, 'pruefung'));
  const open = entries.filter(e => e.craneId === crane.id && e.offen).length;
  const worst = Math.min(w.rank, p.rank, open ? 0 : 9);
  return {w, p, open, worst};
}

/* Fotos verkleinern, damit der Speicher nicht vollläuft */
function shrinkImage(file, max = 1280, q = 0.75){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = e => { URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}

/* ---------- Server-Abgleich (nur wenn die App vom eigenen Server kommt) ---------- */
const Sync = {
  mode: localStorage.getItem('serverMode') === '1',
  token: localStorage.getItem('token') || '',
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  state: 'ok', busy: false, again: false, timer: null,
  lastOk: Number(localStorage.getItem('lastSync') || 0),

  async api(path, body, method = body ? 'POST' : 'GET'){
    const r = await fetch('api/' + path, {
      method, cache: 'no-store',
      headers: {'Content-Type':'application/json', ...(this.token ? {Authorization: 'Bearer ' + this.token} : {})},
      body: body ? JSON.stringify(body) : undefined,
      signal: AbortSignal.timeout(60000),
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401 && this.token && path !== 'password') { this.setLogin(null); render(); }
    if (!r.ok) { const e = new Error(data.error || 'Fehler ' + r.status); e.status = r.status; throw e; }
    return data;
  },
  /* Erkennen, ob die App von einem Kran-Wartung-Server geladen wurde */
  async detect(){
    try {
      const r = await fetch('api/health', {cache:'no-store', signal: AbortSignal.timeout(5000)});
      const j = r.ok ? await r.json() : null;
      const mode = j?.app === 'kran-wartung';
      if (mode !== this.mode) { this.mode = mode; localStorage.setItem('serverMode', mode ? '1' : '0'); render(); }
    } catch { /* offline: letzten bekannten Modus behalten */ }
    this.updateDot();
    this.now();
  },
  setLogin(res){
    this.token = res?.token || ''; this.user = res?.user || null;
    if (res) { localStorage.setItem('token', this.token); localStorage.setItem('user', JSON.stringify(this.user)); }
    else { localStorage.removeItem('token'); localStorage.removeItem('user'); }
  },
  soon(){ clearTimeout(this.timer); this.timer = setTimeout(() => this.now(), 800); this.updateDot(); },
  async now(manual = false){
    if (!this.mode || !this.token) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.state = 'busy'; this.updateDot();
    try {
      const pending = await DB.all('pending');
      const changes = [];
      for (const p of pending) {
        const data = p.deleted ? null : await DB.get(p.store, p.id);
        changes.push({store: p.store, id: p.id, updated: p.updated, deleted: p.deleted || !data, data});
      }
      const since = Number(localStorage.getItem('since') || 0);
      const res = await this.api('sync', {since, changes});
      // Übertragene Änderungen abhaken (außer sie wurden inzwischen erneut geändert)
      for (const p of pending) {
        const cur = await DB.get('pending', p.key);
        if (cur && cur.updated === p.updated) await DB.del('pending', p.key);
      }
      let changed = 0;
      for (const c of res.changes) {
        if (!['cranes','entries'].includes(c.store)) continue;
        if (await DB.get('pending', c.store + ':' + c.id)) continue; // lokale, neuere Änderung hat Vorrang
        const local = await DB.get(c.store, c.id);
        if (c.deleted) { if (local) { await DB.del(c.store, c.id); changed++; } }
        else if (!local || local.updated !== c.updated) { await DB.put(c.store, c.data); changed++; }
      }
      localStorage.setItem('since', String(res.rev));
      this.lastOk = Date.now(); localStorage.setItem('lastSync', String(this.lastOk));
      this.state = 'ok';
      if (changed && !/\/(neu|bearbeiten)/.test(location.hash) && !(Sync.mode && !Sync.token)) render({keepScroll:true});
      if (manual) toast(changed ? `${changed} Änderung(en) empfangen` : 'Alles abgeglichen');
    } catch (e) {
      this.state = e.status ? 'error' : 'offline';
      if (manual) toast(e.status ? 'Abgleich fehlgeschlagen: ' + e.message : 'Server nicht erreichbar – Daten bleiben gespeichert');
    } finally {
      this.busy = false;
      await this.updateDot();
      if (this.again) { this.again = false; this.now(); }
    }
  },
  async updateDot(){
    const el = $('#sync');
    el.classList.toggle('show', this.mode && !!this.token);
    if (!this.mode || !this.token) return;
    const n = (await DB.all('pending')).length;
    const st = this.state === 'ok' && n ? 'pending' : this.state;
    el.className = 'show ' + st;
    el.title = {ok:'Abgeglichen', pending:`${n} Änderung(en) warten auf Abgleich`, busy:'Abgleich läuft …',
      offline:'Offline – wird später abgeglichen', error:'Abgleich fehlgeschlagen'}[st];
  },
};

/* ---------- Router ---------- */
const routes = [
  [/^\/$/, viewHome],
  [/^\/kraene$/, viewCranes],
  [/^\/kran\/neu$/, () => viewCraneForm(null)],
  [/^\/kran\/([\w]+)\/bearbeiten$/, id => viewCraneForm(id)],
  [/^\/kran\/([\w]+)$/, viewCrane],
  [/^\/eintrag\/neu\/([\w]+)(?:\/(\w+))?$/, (cid, art) => viewEntryForm(null, cid, art)],
  [/^\/eintrag\/([\w]+)\/bearbeiten$/, id => viewEntryForm(id)],
  [/^\/eintrag\/([\w]+)$/, viewEntry],
  [/^\/verlauf$/, viewHistory],
  [/^\/mehr$/, viewMore],
  [/^\/benutzer$/, viewUsers],
];
// Ansichten nacheinander zeichnen, damit eine langsame Ansicht keine neuere überschreibt
let renderChain = Promise.resolve();
function render(opts){ return renderChain = renderChain.then(() => renderNow(opts)).catch(console.error); }
async function renderNow({keepScroll = false} = {}){
  const path = location.hash.slice(1) || '/';
  document.body.classList.toggle('login', Sync.mode && !Sync.token);
  if (Sync.mode && !Sync.token) return viewLogin();
  const tab = path.startsWith('/kran') ? 'kraene' : path.startsWith('/verlauf') || path.startsWith('/eintrag') ? 'verlauf' : path.startsWith('/mehr') ? 'mehr' : 'home';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
  for (const [re, fn] of routes) {
    const m = path.match(re);
    if (m) { const y = window.scrollY; await fn(...m.slice(1)); window.scrollTo(0, keepScroll ? y : 0); return; }
  }
  location.hash = '#/';
}
window.addEventListener('hashchange', render);
const go = h => { location.hash = h; };

/* ---------- Ansichten ---------- */
async function viewHome(){
  setHeader('Kran-Wartung', '<button onclick="go(\'#/kran/neu\')">+ Kran</button>');
  const [cranes, entries] = await Promise.all([DB.all('cranes'), DB.all('entries')]);
  if (!cranes.length) {
    $('#app').innerHTML = `
      <div class="empty">
        ${craneIcon()}
        <p><b>Noch keine Kräne angelegt.</b></p>
        <p>Lege deinen ersten Kran an, um Wartungen und UVV-Prüfungen zu verfolgen.</p>
      </div>
      <a class="btn" href="#/kran/neu">Ersten Kran anlegen</a>`;
    return;
  }
  const rows = cranes.map(c => ({c, s: craneStatus(c, entries)}));
  const overdue = rows.filter(r => r.s.w.rank === 0 || r.s.p.rank === 0).length;
  const soon = rows.filter(r => r.s.w.rank === 2 || r.s.p.rank === 2).length;
  const openDefects = entries.filter(e => e.offen);

  const tasks = [];
  for (const {c} of rows) {
    for (const art of ['pruefung','wartung']) {
      const info = dueInfo(c, entries, art);
      const st = statusOf(info);
      if (st.rank <= 2) tasks.push({c, art, info, st});
    }
  }
  tasks.sort((a,b) => (a.info.days ?? -99999) - (b.info.days ?? -99999));

  $('#app').innerHTML = `
    <div class="stats">
      <div class="stat"><b style="color:var(--red)">${overdue}</b><span>überfällig</span></div>
      <div class="stat"><b style="color:var(--amber)">${soon}</b><span>in ${SOON_DAYS} Tagen</span></div>
      <div class="stat"><b>${openDefects.length}</b><span>offene Mängel</span></div>
    </div>

    <h2>Fällig</h2>
    ${tasks.length ? tasks.map(t => `
      <a class="card row" href="#/eintrag/neu/${t.c.id}/${t.art}">
        <div class="grow">
          <div class="title">${esc(t.c.name)}</div>
          <div class="muted">${ARTEN[t.art].label}${t.info.due ? ' · ' + t.info.due.toLocaleDateString('de-DE') : ''}</div>
        </div>
        <span class="badge ${t.st.cls}">${t.st.text}</span>
      </a>`).join('') : `<div class="card muted">Alles erledigt – nichts fällig in den nächsten ${SOON_DAYS} Tagen. 👍</div>`}

    ${openDefects.length ? `<h2>Offene Mängel</h2>` + openDefects.sort((a,b)=>b.datum.localeCompare(a.datum)).map(e => {
      const c = cranes.find(c => c.id === e.craneId);
      return `<a class="card row" href="#/eintrag/${e.id}">
        <div class="grow">
          <div class="title">${esc(c ? c.name : 'Unbekannter Kran')}</div>
          <div class="muted">${fmtDate(e.datum)} · ${esc(defectSummary(e))}</div>
        </div><span class="badge b-red">offen</span></a>`;
    }).join('') : ''}
  `;
}

function defectSummary(e){
  const items = Object.entries(e.checks || {}).filter(([,v]) => v === 'mangel').map(([k]) => k);
  if (e.maengel) items.unshift(e.maengel);
  return items.join(', ').slice(0, 90) || ARTEN[e.art]?.label || '';
}

let craneFilter = '';
async function viewCranes(){
  setHeader('Kräne', '<button onclick="go(\'#/kran/neu\')">+ Neu</button>');
  const [cranes, entries] = await Promise.all([DB.all('cranes'), DB.all('entries')]);
  const draw = () => {
    const q = craneFilter.toLowerCase();
    const list = cranes
      .filter(c => !q || [c.name,c.standort,c.hersteller,c.seriennr,c.typ,c.ansteuerung,...FUNK_FELDER.map(([k]) => c[k])].join(' ').toLowerCase().includes(q))
      .map(c => ({c, s: craneStatus(c, entries)}))
      .sort((a,b) => a.s.worst - b.s.worst || a.c.name.localeCompare(b.c.name));
    $('#list').innerHTML = list.length ? list.map(({c,s}) => `
      <a class="card" href="#/kran/${c.id}">
        <div class="row"><div class="grow title">${esc(c.name)}</div>${s.open ? `<span class="badge b-red">${s.open} Mangel</span>` : ''}</div>
        <div class="muted">${esc([c.typ, c.standort, c.ansteuerung].filter(Boolean).join(' · ')) || '&nbsp;'}</div>
        <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px">
          <span class="muted">Wartung</span><span class="badge ${s.w.cls}">${s.w.text}</span>
          <span class="muted" style="margin-left:6px">UVV</span><span class="badge ${s.p.cls}">${s.p.text}</span>
        </div>
      </a>`).join('') : `<div class="empty">${cranes.length ? 'Keine Treffer.' : 'Noch keine Kräne angelegt.'}</div>`;
  };
  $('#app').innerHTML = `
    <input class="search" type="search" placeholder="Suchen (Name, Standort, Seriennr., Funk-ID …)" value="${esc(craneFilter)}" id="q">
    <div id="list"></div>`;
  $('#q').addEventListener('input', e => { craneFilter = e.target.value; draw(); });
  draw();
}

async function viewCrane(id){
  const c = await DB.get('cranes', id);
  if (!c) return go('#/kraene');
  const entries = await DB.all('entries');
  const mine = entries.filter(e => e.craneId === id).sort((a,b) => b.datum.localeCompare(a.datum));
  const w = dueInfo(c, entries, 'wartung'), p = dueInfo(c, entries, 'pruefung');
  const ws = statusOf(w), ps = statusOf(p);
  setHeader(c.name, `<button onclick="go('#/kran/${id}/bearbeiten')">Bearbeiten</button>`);
  const dueLine = (label, info, st) => `
    <div class="row" style="padding:6px 0">
      <div class="grow"><b>${label}</b><div class="muted">${info && info.due ? 'fällig am ' + info.due.toLocaleDateString('de-DE') : info ? 'noch nie durchgeführt' : 'kein Intervall festgelegt'}</div></div>
      <span class="badge ${st.cls}">${st.text}</span>
    </div>`;
  $('#app').innerHTML = `
    <div class="card">
      ${dueLine('Wartung', w, ws)}
      ${dueLine('UVV-Prüfung', p, ps)}
    </div>
    <div class="btns" style="margin-bottom:12px">
      <a class="btn" href="#/eintrag/neu/${id}/wartung">+ Wartung</a>
      <a class="btn" href="#/eintrag/neu/${id}/pruefung">+ Prüfung</a>
      <a class="btn sec" href="#/eintrag/neu/${id}/reparatur">+ Reparatur</a>
      <a class="btn sec" href="#/eintrag/neu/${id}/stoerung">+ Störung</a>
    </div>
    <h2>Stammdaten</h2>
    <div class="card"><dl class="dl">
      ${[['Typ',c.typ],['Hersteller',c.hersteller],['Modell',c.modell],['Seriennr.',c.seriennr],['Inventarnr.',c.inventarnr],
         ['Standort',c.standort],['Traglast',c.traglast ? c.traglast + ' t' : ''],['Baujahr',c.baujahr],
         ['Inbetriebnahme',c.inbetrieb ? fmtDate(c.inbetrieb) : ''],
         ['Wartungsintervall',c.intervallWartung ? c.intervallWartung + ' Tage' : ''],
         ['Prüfintervall',c.intervallPruefung ? c.intervallPruefung + ' Tage' : ''],
         ['Ansprechpartner',c.kontakt],['Notiz',c.notiz]]
        .filter(([,v]) => v).map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}
    </dl></div>
    ${ansteuerungCard(c)}
    <h2>Historie (${mine.length})</h2>
    ${mine.length ? mine.map(entryCard).join('') : '<div class="card muted">Noch keine Einträge.</div>'}
  `;
}

function ansteuerungCard(c){
  if (!c.ansteuerung) return '';
  const rows = [['Art', c.ansteuerung],
    ...(hatHT(c.ansteuerung) ? HT_FELDER.map(([k,l]) => [l, c[k]]) : []),
    ...(hatFunk(c.ansteuerung) ? FUNK_FELDER.map(([k,l]) => [l, c[k]]) : []),
    ['Notiz', c.ansteuerungNotiz]].filter(([,v]) => v);
  return `<h2>Ansteuerung</h2><div class="card"><dl class="dl">
    ${rows.map(([k,v]) => `<dt>${k}</dt><dd${/Adresse|Seriennr|Kanal/.test(k) ? ' style="font-family:ui-monospace,Menlo,monospace"' : ''}>${esc(v)}</dd>`).join('')}
  </dl></div>`;
}

function entryCard(e, crane){
  const a = ARTEN[e.art] || {label:e.art, badge:'b-grey'};
  const defects = Object.values(e.checks || {}).filter(v => v === 'mangel').length;
  return `<a class="card" href="#/eintrag/${e.id}">
    <div class="row">
      <div class="grow">
        <div class="title">${crane ? esc(crane.name) : a.label}</div>
        <div class="muted">${crane ? a.label + ' · ' : ''}${fmtDate(e.datum)}${e.techniker ? ' · ' + esc(e.techniker) : ''}</div>
      </div>
      ${e.offen ? '<span class="badge b-red">Mangel offen</span>' : defects ? `<span class="badge b-green">behoben</span>` : `<span class="badge ${a.badge}">${a.label}</span>`}
    </div>
    ${e.notiz ? `<div class="muted" style="margin-top:6px">${esc(e.notiz.slice(0,140))}</div>` : ''}
  </a>`;
}

async function viewEntryForm(id, craneId, art){

  if (id && !e) return go('#/verlauf');
  const cranes = (await DB.all('cranes')).sort((a,b) => a.name.localeCompare(b.name));
  if (!e) {
    art = art && ARTEN[art] ? art : 'wartung';
    const last = localStorage.getItem('techniker') || Sync.user?.name || '';
    e = {craneId, art, datum: today(), techniker: last, checks:{}, fotos:[]};
    if (art === 'wartung' || art === 'pruefung' || art === 'inspektion') DEFAULT_CHECKS.forEach(k => e.checks[k] = '');
  }
  const crane = cranes.find(c => c.id === e.craneId);
  setHeader(id ? 'Eintrag bearbeiten' : `${ARTEN[e.art]?.label || 'Eintrag'} erfassen`);
  let fotos = [...(e.fotos || [])];
  let checks = {...(e.checks || {})};

  const drawChecks = () => {
    const keys = Object.keys(checks);
    $('#checks').innerHTML = keys.length ? keys.map(k => `
      <div class="check">
        <div class="grow">${esc(k)}</div>
        <div class="seg" data-k="${esc(k)}">
          ${[['ok','OK'],['mangel','Mangel'],['na','n. a.']].map(([v,l]) => `<button type="button" data-v="${v}" class="${checks[k] === v ? 'on' : ''}">${l}</button>`).join('')}
        </div>
      </div>`).join('') : '<div class="muted">Keine Prüfpunkte.</div>';
  };
  const drawPhotos = () => {
    $('#photos').innerHTML = fotos.map((src,i) => `<div class="photo"><img src="${src}" data-i="${i}"><button type="button" data-rm="${i}">×</button></div>`).join('');
  };

  $('#app').innerHTML = `
    <form id="form">
      <div class="card">
        <label for="f-crane">Kran *</label>
        <select id="f-crane" name="craneId" required>
          <option value="">– Kran wählen –</option>
          ${cranes.map(c => `<option value="${c.id}" ${c.id === e.craneId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select>
        <div class="grid2">
          <div><label for="f-art">Art</label>
            <select id="f-art" name="art">${Object.entries(ARTEN).map(([k,v]) => `<option value="${k}" ${k === e.art ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div>
          <div><label for="f-datum">Datum</label><input id="f-datum" type="date" name="datum" value="${esc(e.datum)}" required></div>
        </div>
        <div class="grid2">
          <div><label for="f-tech">Techniker / Prüfer</label><input id="f-tech" name="techniker" value="${esc(e.techniker)}"></div>
          <div><label for="f-std">Betriebsstunden</label><input id="f-std" name="stunden" type="number" inputmode="decimal" value="${esc(e.stunden)}"></div>
        </div>
      </div>

      <h2>Prüfpunkte</h2>
      <div class="card">
        <div id="checks"></div>
        <div class="row" style="margin-top:10px">
          <input id="newcheck" placeholder="Eigenen Prüfpunkt hinzufügen" class="grow">
          <button type="button" class="btn sec" id="addcheck" style="width:auto;margin:0;padding:12px 16px">+</button>
        </div>
      </div>

      <h2>Mängel & Arbeiten</h2>
      <div class="card">
        <label for="f-maengel">Festgestellte Mängel</label>
        <textarea id="f-maengel" name="maengel" placeholder="z. B. Hakensicherung defekt">${esc(e.maengel)}</textarea>
        <label for="f-notiz">Durchgeführte Arbeiten / Notiz</label>
        <textarea id="f-notiz" name="notiz" placeholder="z. B. Seil geschmiert, Bremse nachgestellt">${esc(e.notiz)}</textarea>
        <label for="f-teile">Ersatzteile / Material</label>
        <input id="f-teile" name="teile" value="${esc(e.teile)}">
        <label class="row" style="margin-top:14px;color:var(--text)">
          <input type="checkbox" name="offen" id="f-offen" ${e.offen ? 'checked' : ''} style="width:22px;height:22px;flex:none">
          Mangel ist noch offen (nicht behoben)
        </label>
      </div>

      <h2>Fotos</h2>
      <div class="card">
        <div class="photos" id="photos"></div>
        <label class="btn sec" style="margin:10px 0 0;color:var(--text)">📷 Foto aufnehmen / wählen
          <input type="file" accept="image/*" capture="environment" multiple id="file" hidden></label>
      </div>

      <button class="btn" type="submit">Speichern</button>
      <a class="btn sec" href="${id ? '#/eintrag/' + id : crane ? '#/kran/' + crane.id : '#/'}">Abbrechen</a>
    </form>`;
  drawChecks(); drawPhotos();

  $('#checks').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-v]'); if (!b) return;
    const k = b.parentElement.dataset.k;
    checks[k] = checks[k] === b.dataset.v ? '' : b.dataset.v;
    if (b.dataset.v === 'mangel' && checks[k] === 'mangel') $('#f-offen').checked = true;
    drawChecks();
  });
  $('#addcheck').addEventListener('click', () => {
    const v = $('#newcheck').value.trim(); if (!v) return;
    checks[v] = checks[v] || ''; $('#newcheck').value = ''; drawChecks();
  });
  $('#file').addEventListener('change', async ev => {
    for (const file of ev.target.files) {
      try { fotos.push(await shrinkImage(file)); } catch { toast('Foto konnte nicht geladen werden'); }
    }
    ev.target.value = ''; drawPhotos();
  });
  $('#photos').addEventListener('click', ev => {
    const rm = ev.target.dataset.rm;
    if (rm !== undefined) { fotos.splice(Number(rm), 1); drawPhotos(); }
    else if (ev.target.tagName === 'IMG') showImage(ev.target.src);
  });
  $('#form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(ev.target));
    const obj = {...e, ...data, offen: !!data.offen, checks, fotos, id: e.id || uid()};
    if (obj.offen && !e.offen) obj.behobenAm = '';
    await DB.save('entries', obj);
    if (obj.techniker) localStorage.setItem('techniker', obj.techniker);
    toast('Eintrag gespeichert');
    go('#/kran/' + obj.craneId);
  });
}

  const checks = Object.entries(e.checks || {});
  $('#app').innerHTML = `
    <div class="card">
      <div class="row"><div class="grow">
        <div class="title">${c ? `<a href="#/kran/${c.id}" style="color:inherit">${esc(c.name)}</a>` : 'Unbekannter Kran'}</div>
        <div class="muted">${fmtDate(e.datum)}${e.techniker ? ' · ' + esc(e.techniker) : ''}</div>
      </div>${e.offen ? '<span class="badge b-red">Mangel offen</span>' : ''}</div>
      ${e.stunden ? `<div class="muted" style="margin-top:6px">Betriebsstunden: ${esc(e.stunden)}</div>` : ''}
    </div>
    ${e.offen ? `<button class="btn" id="fix">✔ Mangel als behoben markieren</button>` : e.behobenAm ? `<div class="card muted">Mangel behoben am ${fmtDate(e.behobenAm)}</div>` : ''}
    ${checks.length ? `<h2>Prüfpunkte</h2><div class="card">${checks.map(([k,v]) => `
      <div class="check"><div class="grow">${esc(k)}</div><span class="badge ${checkLabel[v][1]}">${checkLabel[v][0]}</span></div>`).join('')}</div>` : ''}
    ${e.maengel ? `<h2>Mängel</h2><div class="card" style="white-space:pre-wrap">${esc(e.maengel)}</div>` : ''}
    ${e.notiz ? `<h2>Arbeiten / Notiz</h2><div class="card" style="white-space:pre-wrap">${esc(e.notiz)}</div>` : ''}
    ${e.teile ? `<h2>Ersatzteile</h2><div class="card">${esc(e.teile)}</div>` : ''}
    ${(e.fotos||[]).length ? `<h2>Fotos</h2><div class="card"><div class="photos" id="photos">${e.fotos.map(s => `<img src="${s}">`).join('')}</div></div>` : ''}
    <div style="margin-top:16px">
      <button class="btn sec" id="share">Bericht teilen</button>
      <button class="btn danger" id="del">Eintrag löschen</button>
    </div>`;
  $('#photos')?.addEventListener('click', ev => { if (ev.target.tagName === 'IMG') showImage(ev.target.src); });
  $('#fix')?.addEventListener('click', async () => {
    e.offen = false; e.behobenAm = today();
    await DB.save('entries', e); toast('Als behoben markiert'); render();
  });
  $('#del').addEventListener('click', async () => {
    if (!confirm('Eintrag wirklich löschen?')) return;
    await DB.remove('entries', id); toast('Gelöscht'); go(c ? '#/kran/' + c.id : '#/verlauf');
  });
  $('#share').addEventListener('click', async () => {
    const lines = [
      `${a.label} – ${c ? c.name : ''}`,
      `Datum: ${fmtDate(e.datum)}`,
      c?.seriennr ? `Seriennr.: ${c.seriennr}` : '',
      c?.standort ? `Standort: ${c.standort}` : '',
      c?.ansteuerung ? `Ansteuerung: ${c.ansteuerung}` : '',
      hatFunk(c?.ansteuerung) && (c.funkSenderAdr || c.funkEmpfAdr) ? `Funk: Sender ${c.funkSenderAdr || '–'} / Empfänger ${c.funkEmpfAdr || '–'}` : '',
      e.techniker ? `Techniker: ${e.techniker}` : '',
      e.stunden ? `Betriebsstunden: ${e.stunden}` : '',
      checks.length ? '\nPrüfpunkte:\n' + checks.map(([k,v]) => `- ${k}: ${checkLabel[v][0]}`).join('\n') : '',
      e.maengel ? `\nMängel:\n${e.maengel}` : '',
      e.notiz ? `\nArbeiten:\n${e.notiz}` : '',
      e.teile ? `\nErsatzteile: ${e.teile}` : '',
      e.offen ? '\nStatus: Mangel OFFEN' : e.behobenAm ? `\nMangel behoben am ${fmtDate(e.behobenAm)}` : '',
    ].filter(Boolean).join('\n');
    if (navigator.share) { try { await navigator.share({title: a.label, text: lines}); } catch {} }
    else { await navigator.clipboard?.writeText(lines); toast('Bericht kopiert'); }
  });
}

let histFilter = 'alle';
async function viewHistory(){
  setHeader('Verlauf');
  const [cranes, entries] = await Promise.all([DB.all('cranes'), DB.all('entries')]);
  const byId = Object.fromEntries(cranes.map(c => [c.id, c]));
  const draw = () => {
    const list = entries
      .filter(e => histFilter === 'alle' || (histFilter === 'offen' ? e.offen : e.art === histFilter))
      .sort((a,b) => b.datum.localeCompare(a.datum) || (b.updated||0) - (a.updated||0));
    $('#list').innerHTML = list.length ? list.map(e => entryCard(e, byId[e.craneId] || {name:'Unbekannter Kran'})).join('')
      : '<div class="empty">Keine Einträge.</div>';
    document.querySelectorAll('.pill-tabs button').forEach(b => b.classList.toggle('on', b.dataset.f === histFilter));
  };
  $('#app').innerHTML = `
    <div class="pill-tabs">
      ${[['alle','Alle'],['offen','Offene Mängel'],...Object.entries(ARTEN).map(([k,v]) => [k, v.label])]
        .map(([k,l]) => `<button data-f="${k}">${l}</button>`).join('')}
    </div>
    <div id="list"></div>`;
  $('.pill-tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { histFilter = b.dataset.f; draw(); } });
  draw();
}

async function viewMore(){
  setHeader('Mehr');
  const [cranes, entries] = await Promise.all([DB.all('cranes'), DB.all('entries')]);
  let usage = '';
  if (navigator.storage?.estimate) {
    const {usage: u} = await navigator.storage.estimate();
    usage = ` · ${(u / 1048576).toFixed(1)} MB belegt`;
  }
  const persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : false;
  const account = await accountSection();
  $('#app').innerHTML = account + `
    <h2>Daten</h2>
    <div class="card muted">${cranes.length} Kräne · ${entries.length} Einträge${usage}<br>
      Speicher ${persisted ? 'dauerhaft gesichert ✔' : 'nicht dauerhaft – bitte regelmäßig Backup machen'}</div>
    <button class="btn" id="export">Backup exportieren (JSON)</button>
    <label class="btn sec" style="color:var(--text)">Backup importieren
      <input type="file" accept="application/json,.json" id="import" hidden></label>
    <button class="btn sec" id="csv">Einträge als CSV (Excel) exportieren</button>

    <h2>Installieren</h2>
    <div class="card muted">
      <b style="color:var(--text)">iPhone (Safari):</b> Teilen-Symbol → „Zum Home-Bildschirm“.<br>
      <b style="color:var(--text)">Android (Chrome):</b> Menü ⋮ → „App installieren“ bzw. „Zum Startbildschirm hinzufügen“.<br><br>
      Die App funktioniert danach auch offline.${Sync.mode ? ' Änderungen werden automatisch mit dem Server abgeglichen.' : ' Alle Daten bleiben nur auf diesem Gerät.'}
    </div>

    ${!Sync.mode || Sync.user?.admin ? `<h2>Gefahrenzone</h2>
    <button class="btn danger" id="wipe">Alle Daten löschen${Sync.mode ? ' (für alle Benutzer)' : ''}</button>` : ''}
    <div class="muted" style="text-align:center;margin-top:20px">Kran-Wartung v1.2${Sync.mode ? ' · Server-Modus' : ' · nur auf diesem Gerät'}</div>`;
  bindAccount();

  const download = (name, text, type) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type}));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  $('#export').addEventListener('click', () => {
    download(`kran-wartung-backup-${today()}.json`, JSON.stringify({app:'kran-wartung', version:1, exported:new Date().toISOString(), cranes, entries}), 'application/json');
  });
  $('#csv').addEventListener('click', () => {
    const byId = Object.fromEntries(cranes.map(c => [c.id, c]));
    const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
    const head = ['Datum','Kran','Seriennr.','Standort','Art','Techniker','Betriebsstunden','Mängel (Prüfpunkte)','Mängel','Arbeiten','Ersatzteile','Status'];
    const rows = entries.sort((a,b) => a.datum.localeCompare(b.datum)).map(e => {
      const c = byId[e.craneId] || {};
      return [fmtDate(e.datum), c.name, c.seriennr, c.standort, ARTEN[e.art]?.label || e.art, e.techniker, e.stunden,
        Object.entries(e.checks||{}).filter(([,v]) => v === 'mangel').map(([k]) => k).join('; '),
        e.maengel, e.notiz, e.teile, e.offen ? 'offen' : (e.behobenAm ? 'behoben ' + fmtDate(e.behobenAm) : '')].map(q).join(';');
    });
    download(`kran-wartung-${today()}.csv`, '﻿' + [head.map(q).join(';'), ...rows].join('\r\n'), 'text/csv');
  });
  $('#import').addEventListener('change', async ev => {
    const file = ev.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.cranes) || !Array.isArray(data.entries)) throw new Error('Format');
      if (!confirm(`${data.cranes.length} Kräne und ${data.entries.length} Einträge importieren? Vorhandene Einträge mit gleicher ID werden überschrieben.`)) return;
      for (const c of data.cranes) await DB.save('cranes', c, {keepUpdated:true});
      for (const e of data.entries) await DB.save('entries', e, {keepUpdated:true});
      toast('Import erfolgreich'); render();
    } catch { toast('Ungültige Backup-Datei'); }
    ev.target.value = '';
  });
  $('#wipe')?.addEventListener('click', async () => {
    if (!confirm('Wirklich ALLE Kräne und Einträge löschen? Das kann nicht rückgängig gemacht werden.')) return;
    if (prompt('Zum Bestätigen LÖSCHEN eingeben') !== 'LÖSCHEN') return;
    if (Sync.mode) {
      for (const c of cranes) await DB.remove('cranes', c.id);
      for (const e of entries) await DB.remove('entries', e.id);
    } else { await DB.clear('cranes'); await DB.clear('entries'); }
    toast('Alle Daten gelöscht'); go('#/');
  });
}

async function viewLogin(){
  setHeader('Kran-Wartung');
  $('#app').innerHTML = `
    <div class="login-box">
      <div class="empty" style="padding:10px 16px 20px">${craneIcon()}<p><b>Bitte anmelden</b></p></div>
      <form id="form" class="card">
        <label for="l-name">Benutzername</label>
        <input id="l-name" name="name" autocomplete="username" autocapitalize="none" required>
        <label for="l-pw">Passwort</label>
        <input id="l-pw" name="password" type="password" autocomplete="current-password" required>
        <div class="err" id="err"></div>
        <button class="btn" type="submit" style="margin:6px 0 0">Anmelden</button>
      </form>
    </div>`;
  $('#form').addEventListener('submit', async ev => {
    ev.preventDefault();
    try {
      const res = await Sync.api('login', Object.fromEntries(new FormData(ev.target)));
      Sync.setLogin(res);
      localStorage.setItem('since', '0');
      document.body.classList.remove('login');
      go('#/'); await render();
      Sync.now();
    } catch (e) {
      $('#err').textContent = e.status ? e.message : 'Server nicht erreichbar';
    }
  });
}

async function accountSection(){
  if (!Sync.mode || !Sync.token) return '';
  const n = (await DB.all('pending')).length;
  return `
    <h2>Konto & Abgleich</h2>
    <div class="card">
      <div class="row"><div class="grow"><b>${esc(Sync.user?.name)}</b>${Sync.user?.admin ? ' <span class="badge b-amber">Admin</span>' : ''}
        <div class="muted">Letzter Abgleich: ${Sync.lastOk ? new Date(Sync.lastOk).toLocaleString('de-DE') : 'noch nie'}${n ? ` · ${n} Änderung(en) ausstehend` : ''}</div></div></div>
    </div>
    <button class="btn" id="syncnow">Jetzt abgleichen</button>
    ${Sync.user?.admin ? '<a class="btn sec" href="#/benutzer">Benutzer verwalten</a>' : ''}
    <button class="btn sec" id="chpw">Passwort ändern</button>
    <button class="btn sec" id="logout">Abmelden</button>`;
}
function bindAccount(){
  $('#syncnow')?.addEventListener('click', async () => { await Sync.now(true); render({keepScroll:true}); });
  $('#chpw')?.addEventListener('click', async () => {
    const old = prompt('Aktuelles Passwort'); if (!old) return;
    const pw = prompt('Neues Passwort (mind. 6 Zeichen)'); if (!pw) return;
    try { await Sync.api('password', {old, password: pw}); toast('Passwort geändert'); }
    catch (e) { toast(e.message); }
  });
  $('#logout')?.addEventListener('click', async () => {
    const n = (await DB.all('pending')).length;
    if (n && !confirm(`${n} Änderung(en) sind noch nicht auf dem Server und gehen beim Abmelden verloren. Trotzdem abmelden?`)) return;
    if (!n && !confirm('Abmelden?')) return;
    try { await Sync.api('logout', {}); } catch {}
    Sync.setLogin(null);
    await DB.clear('cranes'); await DB.clear('entries'); await DB.clear('pending');
    localStorage.removeItem('since'); localStorage.removeItem('techniker');
    go('#/'); render();
  });
}

async function viewUsers(){
  if (!Sync.mode || !Sync.user?.admin) return go('#/mehr');
  setHeader('Benutzer');
  let users = [];
  try { users = await Sync.api('users'); }
  catch (e) { $('#app').innerHTML = `<div class="card">${esc(e.status ? e.message : 'Server nicht erreichbar – Benutzer können nur online verwaltet werden.')}</div>`; return; }
  $('#app').innerHTML = `
    <h2>Neuer Benutzer</h2>
    <form id="form" class="card" autocomplete="off">
      <label for="u-name">Benutzername</label><input id="u-name" name="name" autocapitalize="none" required>
      <label for="u-pw">Start-Passwort (mind. 6 Zeichen)</label><input id="u-pw" name="password" required minlength="6">
      <label class="row" style="color:var(--text);margin-top:14px"><input type="checkbox" name="admin" style="width:22px;height:22px;flex:none"> Admin (darf Benutzer verwalten)</label>
      <button class="btn" type="submit" style="margin:14px 0 0">Anlegen</button>
    </form>
    <h2>Alle Benutzer (${users.length})</h2>
    ${users.map(u => `
      <div class="card row">
        <div class="grow"><div class="title">${esc(u.name)}</div><div class="muted">${u.admin ? 'Admin' : 'Benutzer'}${u.id === Sync.user.id ? ' · du' : ''}</div></div>
        <button class="badge b-grey" style="border:0;padding:8px 10px" data-pw="${u.id}">Passwort</button>
        ${u.id === Sync.user.id ? '' : `<button class="badge b-red" style="border:0;padding:8px 10px" data-del="${u.id}" data-name="${esc(u.name)}">Löschen</button>`}
      </div>`).join('')}`;
  $('#form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(ev.target));
    try { await Sync.api('users', {...d, admin: !!d.admin}); toast('Benutzer angelegt'); render(); }
    catch (e) { toast(e.message); }
  });
  $('#app').addEventListener('click', async ev => {
    const b = ev.target.closest('button[data-pw],button[data-del]'); if (!b) return;
    try {
      if (b.dataset.pw) {
        const pw = prompt('Neues Passwort (mind. 6 Zeichen)'); if (!pw) return;
        await Sync.api(`users/${b.dataset.pw}/password`, {password: pw}); toast('Passwort gesetzt');
      } else {
        if (!confirm(`Benutzer „${b.dataset.name}“ löschen? Die erfassten Daten bleiben erhalten.`)) return;
        await Sync.api(`users/${b.dataset.del}`, null, 'DELETE'); toast('Benutzer gelöscht'); render();
      }
    } catch (e) { toast(e.message); }
  });
}

function showImage(src){
  const v = document.createElement('div');
  v.className = 'viewer'; v.innerHTML = `<img src="${src}">`;
  v.addEventListener('click', () => v.remove());
  document.body.appendChild(v);
}
function craneIcon(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3l14 4H6"/><path d="M3 21h8"/><path d="M17 7v6"/><path d="M15 13h4v2a2 2 0 01-4 0"/></svg>`;
}

/* ---------- Start ---------- */
navigator.storage?.persist?.();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
$('#sync').addEventListener('click', () => Sync.now(true));
Sync.updateDot();
render();
Sync.detect();
setInterval(() => Sync.now(), 30000);
addEventListener('online', () => Sync.now());
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sync.now(); });
</script>
